<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Server Error</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/error.css') }}?v={{ app_version }}" />
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <div class="error-container">
        <div class="error-code error-code--error">500</div>
        <h1 class="error-title">Server Error</h1>
        <p class="error-message">
          Something went wrong on our end. We're working to fix it!
        </p>
        <div class="error-actions">
          <a href="/" class="btn btn--primary">Go Home</a>
          <a href="javascript:location.reload()" class="btn btn--outline"
            >Try Again</a
          >
        </div>
      </div>
    </main>

    {% include 'components/footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>
